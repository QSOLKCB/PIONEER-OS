<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#99b0af" stroke-opacity=".13"/></pattern>
<clipPath id="clip"><rect width="1280" height="380" rx="14"/></clipPath>
</defs>
